<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 210" width="1080" height="210">
  <rect width="1080" height="210" fill="#000"/>

  <defs>
    <mask id="mTop" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="210">
      <rect x="150" y="4" width="800" height="62" fill="#fff"/>
    </mask>
    <mask id="mBottom" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="210">
      <rect x="150" y="130" width="800" height="62" fill="#fff"/>
    </mask>
    <mask id="mBar" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="210">
      <rect x="165" y="72" width="722" height="53" fill="#fff"/>
    </mask>
  </defs>

  <!-- red bar : scales in from left, holds, collapses -->
  <g transform="translate(165,72)">
    <rect width="722" height="53" fill="#b50000">
      <animateTransform attributeName="transform" type="scale"
        values="0 1;1 1;1 1;0 1" keyTimes="0;0.16;0.78;0.96"
        calcMode="spline" keySplines="0.2 0 0.2 1;0 0 1 1;0.2 0 0.2 1"
        dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- white accent bar -->
  <g transform="translate(878,72)">
    <rect width="13" height="53" fill="#fff">
      <animateTransform attributeName="transform" type="scale"
        values="0 1;1 1;1 1;0 1" keyTimes="0.12;0.22;0.84;0.94"
        dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- NAME upper : slides up into view -->
  <g mask="url(#mTop)">
    <text x="167" y="56" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#fff">GHOST X
      <animateTransform attributeName="transform" type="translate"
        values="0 46;0 0;0 0;0 46" keyTimes="0.14;0.32;0.66;0.84"
        calcMode="spline" keySplines="0.2 0 0.2 1;0 0 1 1;0.2 0 0.2 1"
        dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- NAME lower : slides down into view -->
  <g mask="url(#mBottom)">
    <text x="167" y="180" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#fff">CHEAT
      <animateTransform attributeName="transform" type="translate"
        values="0 -46;0 0;0 0;0 -46" keyTimes="0.14;0.32;0.66;0.84"
        calcMode="spline" keySplines="0.2 0 0.2 1;0 0 1 1;0.2 0 0.2 1"
        dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- TITLE : slides in along the red bar -->
  <g mask="url(#mBar)">
    <text x="185" y="108" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="2" fill="#fff">AI ENGINEER &amp; FULLSTACK DEVELOPER
      <animateTransform attributeName="transform" type="translate"
        values="760 0;0 0;0 0;760 0" keyTimes="0.1;0.3;0.72;0.92"
        calcMode="spline" keySplines="0.2 0 0.2 1;0 0 1 1;0.2 0 0.2 1"
        dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
